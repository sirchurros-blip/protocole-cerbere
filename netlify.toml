# Site statique : aucun build, on publie le dossier tel quel.
[build]
  publish = "."

# Le service worker et la page doivent toujours être revérifiés,
# pour que les mises à jour arrivent vite sur les appareils installés.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
